<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>汉字王国 | 小学生趣味识字</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="loading-mask" id="loadingMask">
  <div class="loading-text">欢迎来到汉字王国 🎉</div>
  <div class="loading-star"><span></span><span></span><span></span></div>
</div>

<div class="header">
  <div class="logo">汉字王国</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索汉字…" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="header-right">
    <button class="header-btn" id="userBtn" title="切换用户">👤 <span id="userNameDisplay">默认</span></button>
    <button class="header-btn" id="eyeBtn" title="护眼模式">👁️</button>
    <button class="header-btn" id="muteBtn" title="音效开关">🔊</button>
    <button class="header-btn" id="starBtn" title="我的">⭐</button>
    <button class="header-btn" id="parentBtn" title="家长中心">👨‍👩‍👧</button>
  </div>
</div>

<div class="float-tool">
  <div class="progress-ring" id="progressRing">
    <svg viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="42"/><circle class="progress-fill" id="progressFill" cx="50" cy="50" r="42"/></svg>
    <div class="progress-text" id="progressText">1/519</div>
  </div>
  <button class="filter-btn" id="filterBtn" title="只看已解锁的字">⭐</button>
  <button class="tool-btn" id="locateBtn" title="定位推荐节点">📍</button>
  <button class="tool-btn" id="zoomIn" title="放大">+</button>
  <button class="tool-btn" id="zoomOut" title="缩小">-</button>
  <button class="tool-btn" id="resetView" title="重置视图">↺</button>
  <button class="tool-btn" id="backRoot" title="返回首页">🏠</button>
  <button class="tool-btn" id="hintToggle" title="使用提示">💡</button>
  <div class="hint-tooltip" id="hintTip">点击 ⭐? 猜字解锁 · 点击汉字查看详情 · 滚轮缩放</div>
</div>

<button class="tool-btn aside-toggle" id="asideToggle">⇆</button>

<div class="aside-panel" id="asidePanel">
  <div class="empty-tip">点击汉字查看详情 👆</div>
  <div id="panelContent" style="display: none;">
    <div class="panel-char" id="panelChar"></div>
    <div class="panel-pinyin" id="panelPinyin"></div>
    <div class="panel-trad" id="panelTrad"></div>
    <button class="voice-btn" id="voicePlay">🔊 点击听读音</button>
    <div class="panel-label">汉字怎么来的？</div>
    <div class="panel-text" id="panelOracle"></div>
    <div class="panel-label">常用词语</div>
    <div class="tag-wrap" id="panelWords"></div>
    <div class="panel-label">相关成语</div>
    <div class="tag-wrap" id="panelIdioms"></div>
    <div class="panel-label">一句话记住</div>
    <div class="panel-text" id="panelOrigin"></div>
    <div class="panel-label">关联汉字</div>
    <div class="tag-wrap" id="panelRelated"></div>
  </div>
</div>

<div id="chart"></div>

<!-- 猜字弹窗 -->
<div class="modal-mask" id="guessMask"><div class="modal-card"><span class="modal-close" id="guessClose">✕</span><div class="modal-title">汉字猜猜乐 🎮</div><div class="guess-hint" id="guessHint"></div><div class="candidate-wrap" id="candidateWrap"></div><input class="guess-input" id="guessInput" placeholder="电脑打字 / 手机手写"><div class="guess-result" id="guessResult"></div><div class="attempt-count" id="attemptCount">剩余机会：3次</div><div class="modal-row"><button class="modal-btn" id="guessSubmit">提交答案</button><button class="modal-btn secondary" id="guessMore">💡 更多提示</button></div><div class="modal-row"><button class="modal-btn secondary" id="guessNext" style="width:100%">跳过</button></div></div></div>

<!-- 我的中心 -->
<div class="modal-mask" id="starMask"><div class="modal-card"><span class="modal-close" id="starClose">✕</span><div class="modal-title">我的汉字王国 ⭐</div><div class="info-row"><span>已认识汉字</span><span id="myCharNum">0</span></div><div class="info-row"><span>获得星星</span><span id="myStarNum">0</span></div><div class="info-row"><span>闯关进度</span><span id="myLevel">第1关</span></div><div class="panel-label">最近认识的字</div><div class="tag-wrap" id="recentChars"></div><div class="panel-label" id="mistakeLabel">错字本</div><div class="tag-wrap" id="mistakeChars"></div><button class="modal-btn" id="reviewMistakes" style="width:100%;margin-top:8px;">📝 复习错字</button><div class="panel-label">我的成就</div><div class="tag-wrap" id="myBadge"><span class="tag-item">识字小能手</span></div></div></div>

<!-- 复习弹窗 -->
<div class="modal-mask" id="reviewMask"><div class="modal-card"><span class="modal-close" id="reviewClose">✕</span><div class="modal-title">错字复习 📝</div><div class="review-char" id="reviewChar"></div><div class="review-pinyin" id="reviewPinyin"></div><div class="review-origin" id="reviewOrigin"></div><div class="modal-row"><button class="modal-btn" id="reviewKnow">✅ 记住了</button><button class="modal-btn secondary" id="reviewSkip">⏭ 下一个</button></div></div></div>

<!-- 家长中心 -->
<div class="modal-mask" id="parentMask"><div class="modal-card"><span class="modal-close" id="parentClose">✕</span><div class="modal-title">家长中心 👨‍👩‍👧</div><div class="setting-row"><span>护眼模式</span><div class="switch" id="eyeSwitch"></div></div><div class="setting-row"><span>每日学习时长限制</span><select id="timeLimit" style="padding:6px;border-radius:6px;"><option value="20">20分钟</option><option value="30" selected>30分钟</option><option value="45">45分钟</option><option value="60">60分钟</option></select></div><div class="panel-label">本周学习报告</div><div class="info-row"><span>本周学习天数</span><span>3天</span></div><div class="info-row"><span>新认识汉字</span><span>12个</span></div><div class="info-row"><span>易错汉字</span><span>2个</span></div></div></div>

<div class="milestone-toast" id="milestoneToast"><div class="milestone-badge" id="milestoneBadge"></div><div class="milestone-title" id="milestoneTitle"></div></div>

<!-- 用户选择 -->
<div class="modal-mask" id="userMask"><div class="modal-card"><span class="modal-close" id="userClose">✕</span><div class="modal-title">选择用户 👤</div><div class="user-list" id="userList"></div><div class="modal-row" style="margin-top:12px;"><input class="guess-input" id="newUserName" placeholder="输入新用户名" style="flex:1;height:42px;font-size:16px;"><button class="modal-btn" id="userCreate" style="width:80px;">创建</button></div></div></div>

<div id="particlePool" style="display:none;"><div class="firework"></div><div class="firework"></div><div class="firework"></div><div class="firework"></div><div class="firework"></div><div class="firework"></div><div class="firework"></div><div class="firework"></div></div>

<script src="echarts.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
