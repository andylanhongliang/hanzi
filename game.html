<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>汉字冒险岛 🎮</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; font-family: 'Microsoft YaHei', sans-serif; }
    #gameCanvas { display: block; margin: 0 auto; cursor: crosshair; }
    #hud {
      position: fixed; top: 0; left: 0; width: 100%;
      pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    // ======================== 配置 ========================
    const CONFIG = {
      GRAVITY: 0.6,
      JUMP_FORCE: -11,
      MOVE_SPEED: 4,
      PLAYER_W: 32,
      PLAYER_H: 32,
      BRICK_W: 48,
      BRICK_H: 48,
      GROUND_Y: 480,
    };

    // ======================== 数据 ========================
    const ALL_NODES = [
      { id:"明", pinyin:"ming", hints:"日+月=明|白天有太阳晚上有月亮|光明|明亮" },
      { id:"林", pinyin:"lin", hints:"木+木=林|两棵树是森林|树木多|树林" },
      { id:"从", pinyin:"cong", hints:"人+人=从|两个人一前一后|跟从|听从" },
      { id:"好", pinyin:"hao", hints:"女+子=好|有女有子就是好|美好|良好" },
      { id:"安", pinyin:"an", hints:"女在屋檐下|女子在家最安全|安全|平安" },
      { id:"家", pinyin:"jia", hints:"屋檐下有猪|有猪才算家|家庭|回家" },
      { id:"男", pinyin:"nan", hints:"在田里出力的人|男人|男生" },
      { id:"休", pinyin:"xiu", hints:"人靠着树休息|休息|休养" },
    ];

    function getNode(id) { return ALL_NODES.find(n => n.id === id); }

    // ======================== 游戏状态 ========================
    const keys = {};
    let gameTime = 0, paused = false, lastTime = 0;
    let gameState = 'ready'; // ready | playing | quiz | levelclear | gameover
    let currentQuizBrick = null;
    let answerCallback = null;
    let hearts = 3;
    let score = 0;
    let collected = 0;
    let targetCount = 0;
    let levelComplete = false;
    let gameOverTimer = 0;

    // ======================== Canvas ========================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ======================== 关卡定义 ========================
    // 精心设计的关卡：高低错落，需要跳跃
    let bricks = [];
    let platforms = [];
    let enemies = [];
    let particles = [];
    let player = null;
    let exitDoor = null;
    let camera = { x: 0 };

    function createLevel() {
      bricks = [];
      platforms = [];
      enemies = [];
      particles = [];
      hearts = 3;
      score = collected = 0;
      levelComplete = false;

      const B = CONFIG.BRICK_W;
      const H = CONFIG.BRICK_H;
      const GY = CONFIG.GROUND_Y;
      let x = 0;

      // === 区域1: 起始区（一 二 三） ===
      addBrick(x, GY - H, 'normal', '一'); x += B + 4;
      addBrick(x, GY - H, 'normal', '二'); x += B + 4;
      addBrick(x, GY - H, 'normal', '三'); x += B + 4;

      // 小台阶下
      addBrick(0, GY - H * 2, 'normal', '');   // 上面平台
      addBrick(B + 4, GY - H * 2, 'normal', '');
      // 问号砖头在台阶上
      addBrick(B * 1.5, GY - H * 3, 'question', '明', { answer: '明', targetId: '明' });

      // 继续地面
      x = 160;
      addBrick(x, GY - H, 'normal', '人'); x += B + 4;
      addBrick(x, GY - H, 'normal', '大'); x += B + 4;
      addBrick(x, GY - H, 'normal', '木'); x += B + 4;

      // 间隙 (需要跳过去)
      x += 90;

      // === 区域2: 小平台（林 从） ===
      // 第一个平台
      addBrick(x, GY - H * 2.5, 'question', '木', { answer: '林', targetId: '林' });
      // 下面小平台
      addPlatform(x, GY - H, B * 2, 16);
      x += 160;

      // 第二个平台（需要二段跳逻辑，但这里放个垫脚）
      addBrick(x - 60, GY - H, 'clue', '人');
      addBrick(x, GY - H * 2.5, 'question', '人', { answer: '从', targetId: '从' });
      addPlatform(x, GY - H, B * 2, 16);

      x += 200;

      // === 区域3: 高墙（女 子 → 好） ===
      addBrick(x, GY - H, 'clue', '女'); x += B + 4;
      addBrick(x, GY - H, 'normal', '子'); x += B + 4;
      // 问号砖头在第三个台阶高度
      addBrick(x - B * 1.5, GY - H * 3, 'question', '女', { answer: '好', targetId: '好' });
      // 下面三个台阶上去
      addBrick(x - B * 1.5, GY - H, 'normal', '');  // 第一级
      addBrick(x - B * 1.5 + B + 4, GY - H * 2, 'normal', '');  // 第二级

      x += 160;

      // === 区域4: 危险地带（有敌人） ===
      // 敌人1
      enemies.push({ x: x, y: GY - 28, w: 28, h: 28, vx: -1.5, char: '目', alive: true });
      addBrick(x, GY - H, 'normal', '日'); x += B + 4;
      enemies.push({ x: x, y: GY - 28, w: 28, h: 28, vx: 1.5, char: '田', alive: true });
      addBrick(x, GY - H, 'normal', '目'); x += B + 4;

      // 间隙+平台
      x += 50;
      addPlatform(x, GY - H * 2, B * 3, 16);
      addBrick(x + B, GY - H * 3, 'question', '？', { answer: '男', targetId: '男', hint: '在田里出力的人' });
      x += 200;

      // === 区域5: 休息区（休） ===
      addBrick(x, GY - H, 'clue', '人'); x += B + 4;
      addBrick(x, GY - H * 2, 'clue', '木'); x += B + 8;
      addBrick(x, GY - H * 2.5, 'question', '休', { answer: '休', targetId: '休' });
      addPlatform(x, GY - H, B * 2, 16);
      x += 160;

      // === 区域6: 通关区 ===
      addBrick(x, GY - H, 'normal', '平');
      addBrick(x + B + 4, GY - H, 'normal', '安');

      // 终点门
      exitDoor = { x: x + B * 3, y: GY - H * 2, w: 48, h: 80, label: '🚪' };

      // 目标数量统计
      targetCount = bricks.filter(b => b.type === 'question').length;

      // 玩家
      player = { x: 50, y: 400, w: 32, h: 32, vx: 0, vy: 0, onGround: false, facing: 1, jumpSquash: 0 };

      camera = { x: 0, y: 0 };
    }

    function addBrick(x, y, type, char, data) {
      // 带浮动偏移
      const f = bricks.filter(b => Math.abs(b.x - x) < 10 && Math.abs(b.y - y) < 10);
      if (f.length > 0) return; // 避免重叠
      bricks.push({
        x, y, w: CONFIG.BRICK_W, h: CONFIG.BRICK_H,
        type, char: char || '', data: data || {},
        hit: false, floatOffset: Math.random() * Math.PI * 2,
        solid: type !== 'platform',
        answer: data?.answer || '',
      });
    }

    function addPlatform(x, y, w, h) {
      platforms.push({ x, y, w, h });
    }

    // ======================== 输入 ========================
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ') e.preventDefault();
      if (e.key === 'p' || e.key === 'P') { paused = !paused; }
      if (e.key === 'Enter' && gameState === 'levelclear') { createLevel(); gameState = 'playing'; }
    });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    // ======================== 物理/碰撞 ========================
    function updatePlayer(dt) {
      if (gameState !== 'playing') return;

      // 水平移动
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        player.vx = -CONFIG.MOVE_SPEED;
        player.facing = -1;
      } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        player.vx = CONFIG.MOVE_SPEED;
        player.facing = 1;
      } else {
        player.vx *= 0.75; // 摩擦力
      }

      // 跳跃
      if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && player.onGround) {
        player.vy = CONFIG.JUMP_FORCE;
        player.onGround = false;
        player.jumpSquash = -0.4;
      }

      // 重力
      player.vy += CONFIG.GRAVITY;
      if (player.vy > 15) player.vy = 15;

      // 移动
      player.x += player.vx;
      player.y += player.vy;

      // 碰撞检测 — 砖头
      player.onGround = false;
      for (const b of bricks) {
        if (!b.solid) continue;
        if (player.x < b.x + b.w && player.x + player.w > b.x &&
            player.y < b.y + b.h && player.y + player.h > b.y) {
          // 四方向穿透计算
          const overlapBottom = (player.y + player.h) - b.y;
          const overlapTop = (b.y + b.h) - player.y;
          const overlapRight = (player.x + player.w) - b.x;
          const overlapLeft = (b.x + b.w) - player.x;
          const min = Math.min(overlapBottom, overlapTop, overlapRight, overlapLeft);

          if (min === overlapBottom && player.vy >= 0) {
            // 站上去
            player.y = b.y - player.h;
            player.vy = 0;
            player.onGround = true;
          } else if (min === overlapTop && player.vy <= 0) {
            // 从下面顶
            player.y = b.y + b.h;
            player.vy = 2;
            onBrickHitFromBelow(b);
          } else if (min === overlapRight) {
            player.x = b.x - player.w;
            player.vx = 0;
          } else if (min === overlapLeft) {
            player.x = b.x + b.w;
            player.vx = 0;
          }
        }
      }

      // 平台碰撞（只从上方）
      for (const p of platforms) {
        if (player.vy >= 0 &&
            player.y + player.h - player.vy <= p.y + 5 &&
            player.y + player.h >= p.y &&
            player.x + player.w > p.x &&
            player.x < p.x + p.w) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }

      // 地面碰撞
      if (player.y + player.h >= CONFIG.GROUND_Y) {
        player.y = CONFIG.GROUND_Y - player.h;
        player.vy = 0;
        player.onGround = true;
      }

      // 方向跳跃
      player.jumpSquash *= 0.85;

      // 边界
      if (player.x < 0) player.x = 0;

      // 掉落
      if (player.y > canvas.height + 100) {
        hearts--;
        if (hearts <= 0) { gameState = 'gameover'; return; }
        player.x = 50;
        player.y = 300;
        player.vx = 0;
        player.vy = 0;
      }

      // 关卡宽度
      const maxX = exitDoor ? exitDoor.x + 100 : 4000;
      if (player.x > maxX) player.x = maxX;

      // 摄像机
      camera.x = Math.max(0, player.x - canvas.width * 0.35);
    }

    function onBrickHitFromBelow(b) {
      if (b.type === 'question' && !b.hit) {
        b.hit = true;
        triggerQuiz(b);
      }
    }

    // ======================== 答题 ========================
    function triggerQuiz(brick) {
      gameState = 'quiz';
      currentQuizBrick = brick;
      answerCallback = null;

      const targetId = brick.data.targetId || brick.char;
      const node = getNode(targetId);

      let hint = '🔍 猜猜这是什么字？';
      if (node && node.hints) {
        const hints = node.hints.split('|');
        hint = `💡 提示: ${hints[0]}`;
      }
      if (brick.data.hint) {
        hint = `💡 ${brick.data.hint}`;
      }

      // 弹出答题框
      const answer = prompt(hint);
      if (answer && answer.trim() !== '') {
        checkAnswer(answer.trim(), targetId);
      } else {
        // 取消答题，砖头可再次被顶
        b.hit = false;
        gameState = 'playing';
      }
    }

    function checkAnswer(answer, targetId) {
      const node = getNode(targetId);
      const possible = [targetId];
      if (node && node.pinyin) possible.push(node.pinyin);

      const correct = possible.some(p => p.replace(/\s/g, '') === answer.replace(/\s/g, ''));

      if (correct) {
        // 答对!
        currentQuizBrick.char = targetId;
        currentQuizBrick.type = 'normal'; // 变成普通砖头显示答案
        score += 200;
        collected++;

        // 粒子特效
        emitParticles(player.x + player.w / 2, player.y, 15, ['#FFD700', '#FFA500', '#87CEEB']);
        alert(`✅ 答对了！「${targetId}」${node?.pinyin ? '(' + node.pinyin + ')' : ''}`);

        // 检查是否收集完所有目标
        if (collected >= targetCount) {
          levelComplete = true;
          alert('🎉 所有目标字已收集！走到终点门过关！');
        }

        gameState = 'playing';
      } else {
        // 答错
        hearts--;
        if (hearts <= 0) {
          gameState = 'gameover';
          return;
        }
        // 砖头重置，可再次尝试
        currentQuizBrick.hit = false;
        currentQuizBrick.char = '?';

        const node = getNode(targetId);
        const hints = node?.hints?.split('|') || [];
        const nextHint = Math.min(currentQuizBrick.hintLevel || 0, hints.length - 1);
        if (hints[nextHint]) {
          alert(`❌ 不对哦，剩余生命: ❤️×${hearts}\n💡 ${hints[nextHint]}`);
          currentQuizBrick.hintLevel = nextHint + 1;
        } else {
          alert(`❌ 不对哦，剩余生命: ❤️×${hearts}`);
        }
        gameState = 'playing';
      }
    }

    // ======================== 粒子 ========================
    function emitParticles(x, y, count, colors) {
      for (let i = 0; i < count && particles.length < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 0.5 + Math.random() * 0.3,
          maxLife: 0.8,
          size: 3 + Math.random() * 4,
          color: colors[Math.floor(Math.random() * colors.length)],
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const sx = p.x - camera.x;
        const sy = p.y - camera.y;
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(sx, sy, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ======================== 绘制 ========================
    function drawBackground() {
      // 天空渐变
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#A8D8EA');
      grad.addColorStop(1, '#E8F5E9');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 云朵（视差）
      const cloudX = -camera.x * 0.2;
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (const c of [
        { x: 100 + cloudX, y: 60, s: 50 },
        { x: 350 + cloudX * 0.8, y: 90, s: 40 },
        { x: 650 + cloudX * 0.6, y: 50, s: 55 },
        { x: 900 + cloudX * 0.7, y: 80, s: 35 },
      ]) {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.s * 0.4, 0, Math.PI * 2);
        ctx.arc(c.x + c.s * 0.3, c.y - 5, c.s * 0.5, 0, Math.PI * 2);
        ctx.arc(c.x + c.s * 0.7, c.y, c.s * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // 远山
      const mtnX = -camera.x * 0.4;
      ctx.fillStyle = 'rgba(100,160,100,0.2)';
      ctx.beginPath();
      ctx.moveTo(mtnX, CONFIG.GROUND_Y);
      ctx.lineTo(mtnX + 200, CONFIG.GROUND_Y - 100);
      ctx.lineTo(mtnX + 400, CONFIG.GROUND_Y - 30);
      ctx.lineTo(mtnX + 600, CONFIG.GROUND_Y - 120);
      ctx.lineTo(mtnX + 900, CONFIG.GROUND_Y - 60);
      ctx.lineTo(mtnX + 1200, CONFIG.GROUND_Y);
      ctx.fill();

      // 地面主体
      ctx.fillStyle = '#8B7355';
      ctx.fillRect(-camera.x, CONFIG.GROUND_Y, 5000, canvas.height);

      // 草地
      ctx.fillStyle = '#7CFC00';
      ctx.fillRect(-camera.x, CONFIG.GROUND_Y, 5000, 6);
      ctx.fillStyle = '#32CD32';
      ctx.fillRect(-camera.x, CONFIG.GROUND_Y, 5000, 3);
    }

    function drawBrick(b) {
      const sx = b.x - camera.x;
      const sy = b.y + (b.type === 'question' && !b.hit ? Math.sin(gameTime * 3 + b.floatOffset) * 3 : 0);

      if (b.type === 'question' && !b.hit) {
        // 金色发光浮动方块
        for (let i = 3; i >= 0; i--) {
          ctx.fillStyle = `rgba(255,215,0,${0.15 - i * 0.03})`;
          ctx.fillRect(sx - i * 2, sy - i * 2, b.w + i * 4, b.h + i * 4);
        }
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(sx, sy, b.w, b.h);
        ctx.strokeStyle = '#FF8C00';
        ctx.lineWidth = 3;
        ctx.strokeRect(sx, sy, b.w, b.h);
        // 问号
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('❓', sx + b.w / 2, sy + b.h / 2);
      } else if (b.type === 'question' && b.hit) {
        // 已答对的
        ctx.fillStyle = '#90EE90';
        ctx.fillRect(sx, sy, b.w, b.h);
        ctx.strokeStyle = '#228B22';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, sy, b.w, b.h);
        ctx.fillStyle = '#006400';
        ctx.font = 'bold 18px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.char, sx + b.w / 2, sy + b.h / 2);
      } else if (b.type === 'clue') {
        // 提示砖头 — 蓝色摇摆
        const tilt = Math.sin(gameTime * 2 + b.floatOffset) * 0.04;
        ctx.save();
        ctx.translate(sx + b.w / 2, sy + b.h / 2);
        ctx.rotate(tilt);
        ctx.fillStyle = '#E0F7FA';
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.strokeStyle = '#4DD0E1';
        ctx.lineWidth = 2;
        ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.fillStyle = '#00695C';
        ctx.font = 'bold 16px "Microsoft YaHei"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.char, 0, 0);
        ctx.restore();
      } else {
        // 普通砖头
        ctx.fillStyle = '#FFE4B5';
        ctx.fillRect(sx, sy, b.w, b.h);
        ctx.strokeStyle = '#DEB887';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, sy, b.w, b.h);
        if (b.char) {
          ctx.fillStyle = '#8B4513';
          ctx.font = 'bold 18px "Microsoft YaHei"';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.char, sx + b.w / 2, sy + b.h / 2);
        }
      }
    }

    function drawPlatform(p) {
      const sx = p.x - camera.x;
      ctx.fillStyle = '#A0522D';
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 1;
      ctx.strokeRect(sx, p.y, p.w, p.h);
    }

    function drawPlayer() {
      const sx = player.x - camera.x;
      const sy = player.y - camera.y;

      ctx.save();
      ctx.translate(sx + player.w / 2, sy + player.h / 2);
      ctx.scale(player.facing * (1 + player.jumpSquash * 0.2), 1 - player.jumpSquash * 0.2);

      const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, player.w * 0.55);
      bodyGrad.addColorStop(0, '#FFD93D');
      bodyGrad.addColorStop(1, '#FF6B35');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(0, 0, player.w * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // 眼睛
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-6, -4, 7, 0, Math.PI * 2);
      ctx.arc(6, -4, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-4 + player.facing * 2, -4, 3.5, 0, Math.PI * 2);
      ctx.arc(8 + player.facing * 2, -4, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // 微笑
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 1, 5, 0.2, Math.PI - 0.2);
      ctx.stroke();

      ctx.restore();
    }

    function drawEnemy(e) {
      if (!e.alive) return;
      const sx = e.x - camera.x;
      const sy = e.y - camera.y;

      ctx.fillStyle = '#FF4444';
      ctx.beginPath();
      ctx.arc(sx + e.w / 2, sy + e.h / 2, e.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#AA0000';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 叉叉眼
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(sx + 8, sy + 10); ctx.lineTo(sx + 14, sy + 16);
      ctx.moveTo(sx + 14, sy + 10); ctx.lineTo(sx + 8, sy + 16);
      ctx.moveTo(sx + e.w - 8, sy + 10); ctx.lineTo(sx + e.w - 14, sy + 16);
      ctx.moveTo(sx + e.w - 14, sy + 10); ctx.lineTo(sx + e.w - 8, sy + 16);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(e.char, sx + e.w / 2, sy + e.h + 14);
    }

    function drawExitDoor() {
      if (!exitDoor) return;
      const sx = exitDoor.x - camera.x;
      const sy = exitDoor.y - camera.y;

      // 拱门
      ctx.fillStyle = '#228B22';
      ctx.beginPath();
      ctx.arc(sx + exitDoor.w / 2, sy + 10, exitDoor.w / 2, Math.PI, 0);
      ctx.fillRect(sx, sy + 10, exitDoor.w, exitDoor.h - 10);
      ctx.fill();

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx + exitDoor.w / 2, sy + 10, exitDoor.w / 2, Math.PI, 0);
      ctx.strokeRect(sx, sy + 10, exitDoor.w, exitDoor.h - 10);
      ctx.stroke();

      ctx.fillStyle = '#FFD700';
      ctx.font = '28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🚪', sx + exitDoor.w / 2, sy + exitDoor.h / 2 + 5);

      // 提示
      if (levelComplete) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⭐ 通关之门', sx + exitDoor.w / 2, sy - 15);
      }
    }

    function drawHUD() {
      // 生命
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(10, 10, 200, 70);
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'left';
      let hx = 20;
      ctx.fillStyle = '#FF4444';
      for (let i = 0; i < hearts; i++) {
        ctx.fillText('❤️', hx, 35);
        hx += 26;
      }
      ctx.fillStyle = '#FFD93D';
      ctx.font = '14px sans-serif';
      ctx.fillText(`⭐ ${score} | 📦 ${collected}/${targetCount}`, 20, 60);

      // 操作提示
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(canvas.width - 280, 10, 270, 40);
      ctx.fillStyle = '#ccc';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('← → 移动 | 空格 跳跃 | 顶?砖答题', canvas.width - 20, 35);

      // ESC暂停
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(canvas.width - 120, 55, 110, 25);
      ctx.fillStyle = '#999';
      ctx.font = '11px sans-serif';
      ctx.fillText('按 P 暂停', canvas.width - 20, 73);
    }

    // ======================== 敌人更新 ========================
    function updateEnemies(dt) {
      for (const e of enemies) {
        if (!e.alive) continue;
        e.x += e.vx;
        e.vy = (e.vy || 0) + CONFIG.GRAVITY;
        e.y += e.vy;
        if (e.y + e.h >= CONFIG.GROUND_Y) {
          e.y = CONFIG.GROUND_Y - e.h;
          e.vy = 0;
        }
        // 碰到砖头反向
        for (const b of bricks) {
          if (b.solid && e.x < b.x + b.w && e.x + e.w > b.x &&
              e.y < b.y + b.h && e.y + e.h > b.y) {
            e.vx = -e.vx;
            break;
          }
        }

        // 与玩家碰撞
        if (e.alive && player.x < e.x + e.w && player.x + player.w > e.x &&
            player.y < e.y + e.h && player.y + player.h > e.y) {
          if (player.vy > 0 && player.y + player.h - player.vy <= e.y + 10) {
            // 踩扁
            e.alive = false;
            player.vy = -8;
            emitParticles(e.x + e.w / 2, e.y, 8, ['#FF4444', '#FFA500']);
            score += 50;
          } else if (gameState === 'playing') {
            // 碰到敌人
            hearts--;
            player.vy = -8;
            player.y -= 10;
            if (hearts <= 0) { gameState = 'gameover'; }
          }
        }
      }
    }

    // ======================== 终点逻辑 ========================
    function checkExit() {
      if (!exitDoor || !player || !levelComplete) return;
      if (player.x + player.w > exitDoor.x && player.x < exitDoor.x + exitDoor.w &&
          player.y + player.h > exitDoor.y && player.y < exitDoor.y + exitDoor.h) {
        gameState = 'levelclear';
        alert(`🎉 恭喜过关！得分: ${score}，收集: ${collected}/${targetCount} 字`);
      }
    }

    // ======================== 游戏结束 ========================
    function drawGameOver() {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#FF4444';
      ctx.font = 'bold 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('💔 冒险失败', canvas.width / 2, canvas.height / 2 - 30);
      ctx.fillStyle = '#FFD93D';
      ctx.font = '24px sans-serif';
      ctx.fillText(`得分: ${score}`, canvas.width / 2, canvas.height / 2 + 30);
      ctx.fillStyle = '#87CEEB';
      ctx.font = '18px sans-serif';
      ctx.fillText('按 Enter 重新挑战', canvas.width / 2, canvas.height / 2 + 80);
    }

    function drawLevelClear() {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#7CFC00';
      ctx.font = 'bold 48px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🎊 过关！', canvas.width / 2, canvas.height / 2 - 30);
      ctx.fillStyle = '#FFD93D';
      ctx.font = '28px sans-serif';
      ctx.fillText(`得分: ${score} | 收集: ${collected}/${targetCount}`, canvas.width / 2, canvas.height / 2 + 30);
      ctx.fillStyle = '#87CEEB';
      ctx.font = '18px sans-serif';
      ctx.fillText('按 Enter 下一关', canvas.width / 2, canvas.height / 2 + 80);
    }

    // ======================== 右键弹窗提示 ========================
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // ======================== 主循环 ========================
    function gameLoop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;
      gameTime += dt;

      if (!paused) {
        // UI层答题处理（用prompt会阻塞，所以不需要这里的drawQuiz）
        if (gameState === 'playing') {
          updateEnemies(dt);
          updatePlayer(dt);
          updateParticles(dt);
          checkExit();
        }
        if (gameState === 'gameover') {
          if (keys['Enter']) { createLevel(); gameState = 'playing'; keys['Enter'] = false; }
        }
        if (gameState === 'levelclear') {
          if (keys['Enter']) { createLevel(); gameState = 'playing'; keys['Enter'] = false; }
        }
      }

      // 绘制
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();

      // 绘制砖头（按Y排序，远处先画）
      for (const b of bricks) drawBrick(b);
      for (const p of platforms) drawPlatform(p);
      for (const e of enemies) drawEnemy(e);
      drawParticles();
      drawExitDoor();

      if (gameState !== 'gameover' && gameState !== 'levelclear') {
        drawPlayer();
        drawHUD();
      }
      if (gameState === 'gameover') drawGameOver();
      if (gameState === 'levelclear') drawLevelClear();

      // 暂停
      if (paused) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('⏸️ 已暂停', canvas.width / 2, canvas.height / 2);
        ctx.font = '18px sans-serif';
        ctx.fillText('按 P 继续', canvas.width / 2, canvas.height / 2 + 50);
      }

      requestAnimationFrame(gameLoop);
    }

    // ======================== 启动 ========================
    createLevel();
    gameState = 'playing';
    requestAnimationFrame(gameLoop);

    console.log('🎮 汉字冒险岛启动成功！');
    console.log('操作: ← → 移动 | 空格跳跃 | 顶问号砖答题');
  </script>
</body>
