<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>汉字冒险岛 — 诊断版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; font-family: sans-serif; }
    #log {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1a1a2e; color: #0f0; padding: 20px;
      font-size: 14px; overflow: auto; display: none;
    }
    #gameCanvas { display: block; margin: 0 auto; }
    #error { color: red; padding: 20px; text-align: center; display: none; }
  </style>
</head>
<body>
  <div id="error"></div>
  <canvas id="gameCanvas" width="1000" height="600"></canvas>
  <div id="log"></div>

  <script>
    // 全局错误捕获
    window.onerror = function(msg, url, line, col, err) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').innerHTML = 
        '<h2 style="color:red">JS错误!</h2>' +
        '<p>消息: ' + msg + '</p>' +
        '<p>文件: ' + url + '</p>' +
        '<p>行号: ' + line + '</p>';
      return true;
    };

    const log = document.getElementById('log');
    function info(msg) {
      console.log(msg);
      log.innerHTML += '<p>' + msg + '</p>';
      log.scrollTop = log.scrollHeight;
    }

    try {
      info('1. 开始初始化...');

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      info('2. Canvas 获取成功: ' + canvas.width + 'x' + canvas.height);

      let keys = {};
      let gameTime = 0;
      const GROUND_Y = 500;

      // 玩家
      const player = {
        x: 100, y: 300, w: 32, h: 32,
        vx: 0, vy: 0, onGround: false,
        facing: 1, jumpSquash: 0,
      };

      // 砖头数据
      const bricks = [
        { x: 0, y: 452, w: 48, h: 48, type: 'normal', char: '一' },
        { x: 52, y: 452, w: 48, h: 48, type: 'normal', char: '二' },
        { x: 104, y: 452, w: 48, h: 48, type: 'normal', char: '三' },
        { x: 200, y: 452, w: 48, h: 48, type: 'normal', char: '人' },
        { x: 252, y: 452, w: 48, h: 48, type: 'normal', char: '大' },
        { x: 304, y: 452, w: 48, h: 48, type: 'question', char: '?' },
        { x: 356, y: 452, w: 96, h: 16, type: 'platform' },
      ];

      info('3. 游戏数据初始化完成');

      // 绘制函数
      function drawBackground() {
        // 天空
        const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        skyGrad.addColorStop(0, '#87CEEB');
        skyGrad.addColorStop(1, '#E0F7FA');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 云
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(200, 80, 25, 0, Math.PI * 2);
        ctx.arc(225, 70, 30, 0, Math.PI * 2);
        ctx.arc(255, 80, 25, 0, Math.PI * 2);
        ctx.fill();

        // 地面
        ctx.fillStyle = '#7CFC00';
        ctx.fillRect(0, GROUND_Y, canvas.width, 8);
        ctx.fillStyle = '#8B7355';
        ctx.fillRect(0, GROUND_Y + 8, canvas.width, canvas.height - GROUND_Y - 8);
      }

      function drawBrick(brick) {
        if (brick.type === 'normal') {
          ctx.fillStyle = '#FFF9E6';
          ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
          ctx.strokeStyle = '#DEB887';
          ctx.lineWidth = 2;
          ctx.strokeRect(brick.x, brick.y, brick.w, brick.h);
          ctx.fillStyle = '#8B4513';
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(brick.char, brick.x + brick.w / 2, brick.y + brick.h / 2);
        } else if (brick.type === 'question') {
          const floatY = Math.sin(gameTime * 3) * 3;
          // 光晕
          ctx.fillStyle = 'rgba(255,215,0,0.3)';
          ctx.fillRect(brick.x - 5, brick.y - 5 + floatY, brick.w + 10, brick.h + 10);
          ctx.fillStyle = '#FFD700';
          ctx.fillRect(brick.x, brick.y + floatY, brick.w, brick.h);
          ctx.strokeStyle = '#FFA500';
          ctx.lineWidth = 3;
          ctx.strokeRect(brick.x, brick.y + floatY, brick.w, brick.h);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 22px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('?', brick.x + brick.w / 2, brick.y + brick.h / 2 + floatY);
        } else if (brick.type === 'platform') {
          ctx.fillStyle = '#A0522D';
          ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
        }
      }

      function drawPlayer() {
        const sx = player.x;
        const sy = player.y;

        ctx.save();
        ctx.translate(sx + player.w / 2, sy + player.h / 2);
        ctx.scale(player.facing * (1 + player.jumpSquash * 0.2), 1 - player.jumpSquash * 0.2);

        // 身体
        const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, player.w * 0.55);
        bodyGrad.addColorStop(0, '#FFD93D');
        bodyGrad.addColorStop(1, '#FF6B35');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.arc(0, 0, player.w * 0.5, 0, Math.PI * 2);
        ctx.fill();

        // 眼睛
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-6, -4, 7, 0, Math.PI * 2);
        ctx.arc(6, -4, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(-4 + player.facing * 2, -4, 3.5, 0, Math.PI * 2);
        ctx.arc(8 + player.facing * 2, -4, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // 微笑
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 1, 5, 0.2, Math.PI - 0.2);
        ctx.stroke();

        ctx.restore();
      }

      function update(dt) {
        // 移动
        if (keys['ArrowLeft'] || keys['a']) {
          player.vx = -4;
          player.facing = -1;
        } else if (keys['ArrowRight'] || keys['d']) {
          player.vx = 4;
          player.facing = 1;
        } else {
          player.vx *= 0.75;
        }

        // 跳跃
        if ((keys['ArrowUp'] || keys['w'] || keys[' ']) && player.onGround) {
          player.vy = -12;
          player.onGround = false;
          player.jumpSquash = -0.4;
        }

        // 重力
        player.vy += 0.6;
        player.x += player.vx;
        player.y += player.vy;

        // 地面碰撞
        player.onGround = false;
        if (player.y + player.h >= GROUND_Y) {
          player.y = GROUND_Y - player.h;
          player.vy = 0;
          player.onGround = true;
        }

        // 砖头碰撞
        for (const b of bricks) {
          if (b.type === 'platform') continue;
          if (player.x < b.x + b.w && player.x + player.w > b.x &&
              player.y < b.y + b.h && player.y + player.h > b.y) {
            // 从上方碰撞
            if (player.vy >= 0 && player.y + player.h - player.vy <= b.y + 5) {
              player.y = b.y - player.h;
              player.vy = 0;
              player.onGround = true;
            }
          }
        }

        // 平台碰撞
        for (const b of bricks) {
          if (b.type !== 'platform') continue;
          if (player.vy >= 0 &&
              player.y + player.h - player.vy <= b.y &&
              player.y + player.h >= b.y &&
              player.x + player.w > b.x &&
              player.x < b.x + b.w) {
            player.y = b.y - player.h;
            player.vy = 0;
            player.onGround = true;
          }
        }

        player.jumpSquash *= 0.85;

        // 边界
        if (player.x < 0) player.x = 0;
        if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;

        // 掉落重生
        if (player.y > canvas.height + 50) {
          player.x = 100;
          player.y = 300;
          player.vx = 0;
          player.vy = 0;
        }
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        for (const b of bricks) drawBrick(b);
        drawPlayer();

        // HUD
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(10, 10, 320, 50);
        ctx.fillStyle = '#FFD93D';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('← → 移动  |  空格/↑/W 跳跃  |  P键 暂停/继续', 20, 30);
        ctx.fillText('位置: ' + Math.round(player.x) + 'x ' + Math.round(player.y), 20, 50);
      }

      info('4. 绘制函数定义完成');

      // 输入
      window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (e.key === ' ') e.preventDefault();
        if (e.key === 'p' || e.key === 'P') {
          paused = !paused;
        }
      });
      window.addEventListener('keyup', (e) => { keys[e.key] = false; });

      info('5. 事件监听完成');

      // 游戏循环
      let paused = false;
      let lastTime = 0;

      function gameLoop(timestamp) {
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;
        gameTime += dt;

        if (!paused) {
          update(dt);
        }
        render();

        requestAnimationFrame(gameLoop);
      }

      info('6. 启动游戏循环!');
      requestAnimationFrame(gameLoop);

    } catch (e) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').innerHTML = '<h2>初始化错误:</h2><pre>' + e.stack + '</pre>';
    }
  </script>
</body>
</html>
