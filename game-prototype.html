<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>汉字冒险岛 — 视觉原型 v0.1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    #gameCanvas {
      border: 3px solid #FF6B35;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 107, 53, 0.5);
      cursor: crosshair;
    }
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    #info h3 { color: #FFD93D; margin-bottom: 8px; }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: #fff;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1000" height="600"></canvas>
  <div id="info">
    <h3>🎮 汉字冒险岛 — 视觉原型</h3>
    <p>✅ 角色「字灵」— 圆润可爱风</p>
    <p>✅ 砖头 — 圆角渐变，不是硬方块</p>
    <p>✅ 问号块 — 浮动发光动画</p>
    <p>✅ 背景 — 视差天空+山脉</p>
    <p>✅ 地面 — 草地+泥土细节</p>
  </div>
  <div id="controls">
    <p><strong>操作：</strong></p>
    <p>← → 或 A D — 移动</p>
    <p>空格或↑或W — 跳跃</p>
    <p>按 P — 暂停动画预览</p>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ======================== 全局状态 ========================
    let keys = {};
    let gameTime = 0;
    let paused = false;

    // ======================== 摄像机 ========================
    let camera = { x: 0, y: 0 };

    // ======================== 角色 ========================
    const player = {
      x: 200,
      y: 300,
      w: 32,
      h: 32,
      vx: 0,
      vy: 0,
      onGround: false,
      facing: 1, // 1=right, -1=left
      animFrame: 0,
      animTimer: 0,
      jumpSquash: 0, // -1~1, 压扁/拉伸
    };

    // ======================== 关卡数据（原型固定） ========================
    const bricks = [
      // 地面砖头（已学过的字）
      { x: 0, y: 500, char: '一', type: 'normal' },
      { x: 60, y: 500, char: '二', type: 'normal' },
      { x: 120, y: 500, char: '三', type: 'normal' },
      { x: 240, y: 500, char: '人', type: 'normal' },
      { x: 300, y: 500, char: '大', type: 'normal' },
      { x: 420, y: 500, char: '日', type: 'normal' },
      { x: 480, y: 500, char: '月', type: 'normal' },
      // 平台
      { x: 600, y: 420, char: '', type: 'platform' },
      { x: 660, y: 420, char: '', type: 'platform' },
      // 问号砖头
      { x: 580, y: 320, char: '?', type: 'question' },
      { x: 750, y: 500, char: '?', type: 'question' },
      // 线索砖头
      { x: 520, y: 500, char: '日', type: 'clue' },
      { x: 590, y: 500, char: '+', type: 'clue' },
      { x: 660, y: 500, char: '月', type: 'clue' },
    ];

    const enemies = [
      { x: 400, y: 470, w: 28, h: 28, vx: 1, type: 'wrongchar', char: '目' },
    ];

    // ======================== 物理参数 ========================
    const GRAVITY = 0.6;
    const JUMP_FORCE = -12;
    const MOVE_SPEED = 4;

    // ======================== 绘制函数 ========================

    // 背景（视差）
    function drawBackground() {
      // 天空渐变
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#87CEEB');
      skyGrad.addColorStop(1, '#E0F7FA');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 云朵（视差移动）
      const cloudOffset = camera.x * 0.2;
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      drawCloud(200 - cloudOffset, 80, 60);
      drawCloud(500 - cloudOffset, 120, 40);
      drawCloud(800 - cloudOffset * 0.5, 60, 50);

      // 远山（视差）
      const mtnOffset = camera.x * 0.5;
      ctx.fillStyle = 'rgba(100, 150, 100, 0.3)';
      drawMountain(100 - mtnOffset, 350, 300, 150);
      drawMountain(400 - mtnOffset, 370, 250, 130);
      drawMountain(700 - mtnOffset, 360, 350, 140);
    }

    function drawCloud(x, y, size) {
      ctx.beginPath();
      ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
      ctx.arc(x + size * 0.3, y, size * 0.6, 0, Math.PI * 2);
      ctx.arc(x + size * 0.7, y, size * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMountain(x, y, w, h) {
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x + w * 0.3, y);
      ctx.lineTo(x + w * 0.7, y + h * 0.3);
      ctx.lineTo(x + w, y + h);
      ctx.closePath();
      ctx.fill();
    }

    // 地面
    function drawGround() {
      // 泥土层
      const groundY = 500;
      const groundGrad = ctx.createLinearGradient(0, groundY, 0, groundY + 100);
      groundGrad.addColorStop(0, '#8B7355');
      groundGrad.addColorStop(1, '#A0522D');
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, groundY, canvas.width + 200, 100);

      // 草地
      ctx.fillStyle = '#7CFC00';
      ctx.fillRect(0, groundY, canvas.width + 200, 8);
      ctx.fillStyle = '#32CD32';
      ctx.fillRect(0, groundY, canvas.width + 200, 4);

      // 小草
      ctx.strokeStyle = '#228B22';
      ctx.lineWidth = 2;
      for (let x = 0; x < canvas.width + 200; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, groundY);
        ctx.lineTo(x - 3, groundY - 8);
        ctx.moveTo(x, groundY);
        ctx.lineTo(x + 3, groundY - 6);
        ctx.stroke();
      }
    }

    // 角色
    function drawPlayer() {
      const p = player;
      const sx = p.x - camera.x;
      const sy = p.y - camera.y;

      ctx.save();
      ctx.translate(sx + p.w / 2, sy + p.h / 2);
      ctx.scale(p.facing * (1 + p.jumpSquash * 0.2), 1 - p.jumpSquash * 0.2);

      // 身体（渐变圆形）
      const bodyGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, p.w * 0.6);
      bodyGrad.addColorStop(0, '#FFD93D');
      bodyGrad.addColorStop(1, '#FF6B35');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(0, 0, p.w * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // 眼睛
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-6, -4, 8, 0, Math.PI * 2);
      ctx.arc(6, -4, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-4, -4, 4, 0, Math.PI * 2);
      ctx.arc(8, -4, 4, 0, Math.PI * 2);
      ctx.fill();

      // 高光
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-2, -6, 2, 0, Math.PI * 2);
      ctx.arc(10, -6, 2, 0, Math.PI * 2);
      ctx.fill();

      // 嘴巴
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 2, 6, 0.2, Math.PI - 0.2);
      ctx.stroke();

      ctx.restore();
    }

    // 砖头
    function drawBrick(brick) {
      const sx = brick.x - camera.x;
      const sy = brick.y - camera.y;
      const bw = 48;
      const bh = 48;

      ctx.save();

      if (brick.type === 'normal') {
        // 已学字砖头 — 米色渐变
        const grad = ctx.createLinearGradient(sx, sy, sx, sy + bh);
        grad.addColorStop(0, '#FFF9E6');
        grad.addColorStop(1, '#FFE4B5');
        ctx.fillStyle = grad;
        roundRect(sx, sy, bw, bh, 12);
        ctx.fill();
        ctx.strokeStyle = '#DEB887';
        ctx.lineWidth = 2;
        roundRect(sx, sy, bw, bh, 12);
        ctx.stroke();

        // 汉字
        ctx.fillStyle = '#8B4513';
        ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(brick.char, sx + bw / 2, sy + bh / 2);
      } 
      else if (brick.type === 'question') {
        // 问号砖头 — 金色发光浮动
        const floatY = Math.sin(gameTime * 3) * 3;
        const glow = ctx.createRadialGradient(sx + bw / 2, sy + bh / 2 + floatY, 4, sx + bw / 2, sy + bh / 2 + floatY, bw);
        glow.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
        glow.addColorStop(1, 'rgba(255, 165, 0, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(sx - 10, sy - 10 + floatY, bw + 20, bh + 20);

        const grad = ctx.createRadialGradient(sx + bw / 2, sy + bh / 2 + floatY, 4, sx + bw / 2, sy + bh / 2 + floatY, bw * 0.7);
        grad.addColorStop(0, '#FFD700');
        grad.addColorStop(1, '#FF8C00');
        ctx.fillStyle = grad;
        roundRect(sx, sy + floatY, bw, bh, 12);
        ctx.fill();
        ctx.strokeStyle = '#FFA500';
        ctx.lineWidth = 3;
        roundRect(sx, sy + floatY, bw, bh, 12);
        ctx.stroke();

        // 问号
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('❓', sx + bw / 2, sy + bh / 2 + floatY);
      } 
      else if (brick.type === 'clue') {
        // 线索砖头 — 冰蓝色摇摆
        const tilt = Math.sin(gameTime * 2) * 0.05;
        ctx.translate(sx + bw / 2, sy + bh / 2);
        ctx.rotate(tilt);

        const grad = ctx.createLinearGradient(-bw / 2, -bh / 2, -bw / 2, bh / 2);
        grad.addColorStop(0, '#E0F7FA');
        grad.addColorStop(1, '#B2EBF2');
        ctx.fillStyle = grad;
        roundRect(-bw / 2, -bh / 2, bw, bh, 12);
        ctx.fill();
        ctx.strokeStyle = '#4DD0E1';
        ctx.lineWidth = 2;
        roundRect(-bw / 2, -bh / 2, bw, bh, 12);
        ctx.stroke();

        // 文字
        ctx.fillStyle = '#00796B';
        ctx.font = 'bold 14px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(brick.char, 0, 0);
      } 
      else if (brick.type === 'platform') {
        // 平台（简单矩形）
        ctx.fillStyle = '#A0522D';
        roundRect(sx, sy, bw, 16, 6);
        ctx.fill();
      }

      ctx.restore();
    }

    // 圆角矩形辅助
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // 敌人
    function drawEnemy(enemy) {
      const sx = enemy.x - camera.x;
      const sy = enemy.y - camera.y;

      // 身体（方形，红色）
      ctx.fillStyle = '#FF4444';
      roundRect(sx, sy, enemy.w, enemy.h, 8);
      ctx.fill();
      ctx.strokeStyle = '#AA0000';
      ctx.lineWidth = 2;
      roundRect(sx, sy, enemy.w, enemy.h, 8);
      ctx.stroke();

      // 眼睛（叉叉眼，表示"错字"）
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      // 左眼叉
      ctx.beginPath();
      ctx.moveTo(sx + 6, sy + 8);
      ctx.lineTo(sx + 12, sy + 14);
      ctx.moveTo(sx + 12, sy + 8);
      ctx.lineTo(sx + 6, sy + 14);
      ctx.stroke();
      // 右眼叉
      ctx.beginPath();
      ctx.moveTo(sx + enemy.w - 6, sy + 8);
      ctx.lineTo(sx + enemy.w - 12, sy + 14);
      ctx.moveTo(sx + enemy.w - 12, sy + 8);
      ctx.lineTo(sx + enemy.w - 6, sy + 14);
      ctx.stroke();

      // 显示错字
      ctx.fillStyle = '#fff';
      ctx.font = '10px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(enemy.char, sx + enemy.w / 2, sy + enemy.h + 14);
    }

    // 粒子系统（答对特效原型）
    let particles = [];

    function spawnParticles(x, y) {
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI * 2 * i) / 12;
        particles.push({
          x, y,
          vx: Math.cos(angle) * (2 + Math.random() * 3),
          vy: Math.sin(angle) * (2 + Math.random() * 3),
          life: 1.0,
          color: `hsl(${40 + Math.random() * 20}, 100%, ${50 + Math.random() * 30}%)`,
        });
      }
    }

    function drawParticles() {
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1; // 重力
        p.life -= 0.02;

        if (p.life <= 0) {
          particles.splice(i, 1);
          return;
        }

        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - camera.x, p.y - camera.y, 4 * p.life, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // ======================== 游戏逻辑 ========================

    function updatePlayer(dt) {
      // 输入
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
        player.vx = -MOVE_SPEED;
        player.facing = -1;
      } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
        player.vx = MOVE_SPEED;
        player.facing = 1;
      } else {
        player.vx *= 0.8; // 摩擦力
      }

      if ((keys['ArrowUp'] || keys['w'] || keys['W'] || keys[' ']) && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
        player.jumpSquash = -0.5; // 起跳压扁
      }

      // 物理
      player.vy += GRAVITY;
      player.x += player.vx;
      player.y += player.vy;

      // 地面碰撞
      if (player.y + player.h >= 500) {
        player.y = 500 - player.h;
        player.vy = 0;
        player.onGround = true;
        player.jumpSquash = 0.3; // 落地压扁
      } else {
        player.onGround = false;
      }

      // 跳跃squash恢复
      player.jumpSquash *= 0.9;

      // 摄像机跟随
      camera.x = player.x - canvas.width * 0.3;
      camera.y = 0; // 2D横版，Y轴不滚动

      // 边界
      if (player.x < 0) player.x = 0;
    }

    // ======================== 主循环 ========================

    let lastTime = 0;

    function gameLoop(timestamp) {
      if (!paused) {
        const dt = timestamp - lastTime;
        lastTime = timestamp;
        gameTime += dt * 0.001;

        // 更新
        updatePlayer(dt);

        // 绘制
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground();
        drawGround();

        bricks.forEach(drawBrick);
        enemies.forEach(drawEnemy);
        drawParticles();
        drawPlayer();

        // 提示文字
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(10, 10, 220, 80);
        ctx.fillStyle = '#FFD93D';
        ctx.font = '13px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('← → 移动 | 空格 跳跃', 20, 35);
        ctx.fillText('按 K 触发粒子特效', 20, 55);
        ctx.fillText('按 P 暂停/继续', 20, 75);
      }

      requestAnimationFrame(gameLoop);
    }

    // ======================== 输入 ========================

    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;

      if (e.key === 'k' || e.key === 'K') {
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2);
      }
      if (e.key === 'p' || e.key === 'P') {
        paused = !paused;
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // ======================== 启动 ========================
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
